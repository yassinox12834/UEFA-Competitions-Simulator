<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1633"/>
      <stop offset="1" stop-color="#14306B"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- pitch markings, low opacity, right side -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4">
    <line x1="1040" y1="0" x2="1040" y2="640"/>
    <circle cx="1040" cy="320" r="170"/>
    <circle cx="1040" cy="320" r="8" fill="#FFFFFF" fill-opacity="0.10" stroke="none"/>
    <rect x="1210" y="170" width="190" height="300"/>
  </g>

  <!-- accent bar -->
  <rect x="90" y="230" width="90" height="8" fill="#3FA9F5"/>

  <!-- title -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="86" y="340" font-size="92" font-weight="700">UEFA Competition</text>
    <text x="86" y="436" font-size="92" font-weight="700">Simulator</text>
    <text x="90" y="500" font-size="32" font-weight="400" fill="#9FB6E0">Python  |  CustomTkinter</text>
  </g>
</svg>
